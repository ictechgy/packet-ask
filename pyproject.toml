[project]
name = "packet-ask"
version = "0.1.2"
description = "Send only a scrubbed packet to personal Kimi/GLM coding subscriptions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Coden", email = "ictechgy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
keywords = ["cli", "redaction", "kimi", "glm", "claude"]

[project.urls]
Homepage = "https://github.com/ictechgy/packet-ask"
Repository = "https://github.com/ictechgy/packet-ask"
Issues = "https://github.com/ictechgy/packet-ask/issues"

[project.scripts]
packet-ask = "packet_ask:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
