[project]
name = "packet-ask"
version = "0.9.0"
description = "Send only a scrubbed packet to personal coding-subscription subagents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Coden", email = "ictechgy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
keywords = ["cli", "redaction", "kimi", "glm", "claude"]

[project.urls]
Homepage = "https://github.com/ictechgy/packet-ask"
Repository = "https://github.com/ictechgy/packet-ask"
Issues = "https://github.com/ictechgy/packet-ask/issues"

[project.scripts]
packet-ask = "packet_ask:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

# 에이전트 지침은 기여자 문서이지 런타임 데이터가 아니다. `src/packet_ask/`
# 안에 있어 기본값으로는 wheel·sdist 에 실렸고, 그래서 지침만 고쳐도 배포물이
# 바뀌어 패치 릴리스를 부르곤 했다. 배포물에서 뺀다. `data/SKILL.md` 는
# `install-skills` 가 쓰는 실제 런타임 데이터이므로 그대로 싣는다.
[tool.uv.build-backend]
source-exclude = ["src/packet_ask/AGENTS.md"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
